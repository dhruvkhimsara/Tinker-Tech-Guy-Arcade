<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play HexGL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <!-- HexGL works via keyboard controls, so pointer-lock isn't strictly required, but gamepad is supported -->
    <iframe src="https://github.io" allow="autoplay; gamepad; fullscreen"></iframe>
</body>
</html>
