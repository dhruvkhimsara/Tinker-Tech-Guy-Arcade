<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .msg { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; }
        .btn {
            background: #00ff88; color: #000; border: none; padding: 12px 30px;
            font-weight: 800; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="msg">Launching Slither.io in a secure external window...</div>
    <button class="btn" onclick="openGame()">Play Manually</button>

    <script>
        function openGame() {
            window.open("https://slither.com", "_blank");
        }
        // Automatically pop it open immediately when user hits 'PLAY' on your card
        window.onload = openGame;
    </script>

</body>
</html>
